services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: guild
    volumes:
      - guild-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild -d guild"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://guild:${POSTGRES_PASSWORD}@db:5432/guild
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8000}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  guild-data:
